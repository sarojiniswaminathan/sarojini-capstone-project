<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailoring Business Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  </head>
  <body>
    <header class="title-bar">
      <div class="traffic-lights" aria-hidden="true">
        <span class="tl tl-red"></span>
        <span class="tl tl-amber"></span>
        <span class="tl tl-green"></span>
      </div>
      <h1 class="title-bar-text">Tailoring Business Agent</h1>
      <div class="title-bar-status">
        <span id="pending-badge" class="pending-badge" hidden></span>
        <div id="google-status" class="google-status"></div>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <button
          id="sidebar-toggle"
          class="sidebar-toggle"
          type="button"
          aria-label="Toggle sidebar"
          aria-expanded="true"
          aria-controls="fabric-tree"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="9" y1="3" x2="9" y2="21" />
          </svg>
        </button>
        <nav id="fabric-tree" class="fabric-tree" role="tree" aria-label="Fabric inventory"></nav>
      </aside>

      <div class="main-col">
        <main class="calendar-area">
          <div id="calendar-banner" class="calendar-banner" hidden>
            This is your real Google Calendar — <a href="/auth/google/login">connect it</a> to see and add commitments here.
          </div>
          <div class="calendar-card">
            <div class="calendar-toolbar">
              <button id="cal-prev" class="cal-nav" type="button" aria-label="Previous month">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
              </button>
              <div class="cal-select-group">
                <select id="cal-month" class="cal-select"></select>
                <select id="cal-year" class="cal-select"></select>
              </div>
              <button id="cal-next" class="cal-nav" type="button" aria-label="Next month">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6" /></svg>
              </button>
              <div class="cal-view-toggle">
                <button id="cal-view-month" class="cal-view-btn active" type="button">Month</button>
                <button id="cal-view-week" class="cal-view-btn" type="button">Week</button>
              </div>
            </div>
            <div id="calendar"></div>
          </div>
        </main>
      </div>
    </div>

    <aside id="day-panel" class="day-panel" hidden>
      <button id="day-panel-close" class="panel-close" aria-label="Close">&times;</button>
      <div id="day-panel-content"></div>
    </aside>

    <div id="chat-widget" class="chat-widget">
      <button id="chat-toggle" class="chat-toggle" type="button">💬 Ask the agent</button>
      <div id="chat-drawer" class="chat-drawer" hidden>
        <div class="chat-box">
          <div id="messages"></div>
          <form id="chat-form">
            <input id="message" type="text" placeholder="Ask about orders, fabric, or today's plan" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <template id="tree-category-template">
      <div class="tree-category" role="none">
        <button type="button" class="tree-category-header" role="treeitem">
          <svg class="tree-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18" /></svg>
          <span class="tree-category-name"></span>
        </button>
        <div class="tree-children" role="group"></div>
      </div>
    </template>

    <template id="tree-material-template">
      <div class="tree-leaf" role="treeitem">
        <button type="button" class="tree-leaf-label"></button>
        <div class="tree-leaf-swatch" hidden>
          <img alt="" hidden />
          <label class="photo-upload" title="Add a photo">
            📷<input type="file" accept="image/*" hidden />
          </label>
        </div>
        <div class="tree-material-detail" hidden>
          <div class="tree-material-qty"></div>
          <div class="material-adjust">
            <input type="number" step="any" placeholder="+/- qty" />
            <button type="button">Save</button>
          </div>
        </div>
      </div>
    </template>

    <script src="/static/chat.js"></script>
    <script src="/static/inventory.js"></script>
    <script src="/static/calendar.js"></script>
    <script src="/static/layout.js"></script>
  </body>
</html>
